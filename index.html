<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>ACCESS_RESTRICTED</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #000;
    color: #fff;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }

  @supports (height: 100dvh) {
    html, body { height: 100dvh; }
  }

  #terminalScreen {
    position: fixed;
    inset: 0;
    background: #0a0a0a;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    font-family: 'Courier New', monospace;
    color: #33ff33;
    z-index: 10;
    transition: opacity 0.6s, transform 0.6s, filter 0.6s;
    overflow: hidden;
  }

  #terminalScreen.fade-out {
    opacity: 0;
    transform: scale(1.05);
    filter: blur(20px) hue-rotate(90deg);
    pointer-events: none;
  }

  #terminalScreen::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      rgba(0,0,0,0.15),
      rgba(0,0,0,0.15) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events: none;
    z-index: 100;
  }

  .terminal {
    width: 100%;
    max-width: 720px;
    max-height: 90dvh;
    border: 2px solid #33ff33;
    padding: 24px;
    box-shadow: 0 0 40px rgba(51,255,51,0.3), inset 0 0 20px rgba(51,255,51,0.1);
    position: relative;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  .terminal::before {
    content: '● REC';
    position: absolute;
    top: -12px;
    right: 20px;
    background: #0a0a0a;
    padding: 0 8px;
    color: #ff3333;
    font-size: 12px;
    animation: blink 1.5s infinite;
  }

  @keyframes blink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0.3; }
  }

  .line {
    margin-bottom: 8px;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .cursor::after {
    content: '█';
    animation: blink 1s step-end infinite;
    margin-left: 2px;
  }

  .error { color: #ff3333; }

  .start-btn {
    display: block;
    margin: 24px auto 0;
    padding: 14px 32px;
    background: transparent;
    border: 2px solid #33ff33;
    color: #33ff33;
    font-family: inherit;
    font-size: 14px;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s;
    animation: btnPulse 2s ease-in-out infinite;
  }

  .start-btn:hover,
  .start-btn:active {
    background: #33ff33;
    color: #0a0a0a;
    box-shadow: 0 0 30px #33ff33;
  }

  @keyframes btnPulse {
    0%, 100% { box-shadow: 0 0 0 rgba(51,255,51,0); }
    50%      { box-shadow: 0 0 20px rgba(51,255,51,0.6); }
  }

  .input-line {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 16px;
  }

  .input-line .prompt { color: #33ff33; }

  input[type="text"] {
    background: transparent;
    border: none;
    outline: none;
    color: #33ff33;
    font-family: inherit;
    font-size: 16px;
    flex: 1;
    caret-color: #33ff33;
    letter-spacing: 2px;
    padding: 4px 0;
    min-width: 0;
  }

  #glitchOverlay {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 500;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s;
  }

  #glitchOverlay.active {
    opacity: 1;
    animation: fullGlitch 0.12s steps(2) infinite;
  }

  @keyframes fullGlitch {
    0%   { transform: translate(0);         filter: hue-rotate(0deg); }
    20%  { transform: translate(-8px, 4px);  filter: hue-rotate(90deg); }
    40%  { transform: translate(8px, -4px);  filter: hue-rotate(180deg); }
    60%  { transform: translate(-4px, -4px); filter: hue-rotate(270deg); }
    80%  { transform: translate(6px, 2px);   filter: hue-rotate(45deg); }
    100% { transform: translate(0);         filter: hue-rotate(360deg); }
  }

  #trailerScreen {
    position: fixed;
    inset: 0;
    display: none;
    font-family: 'Georgia', 'Times New Roman', serif;
    z-index: 1;
    overflow: hidden;
  }

  #trailerScreen.visible { display: block; }

  .bg {
    position: absolute;
    inset: -10%;
    background:
      radial-gradient(ellipse at 50% 50%,
        #2a1a3a 0%,
        #1a0a2a 40%,
        #0a0a1a 75%,
        #000 100%);
    animation: slowZoom 20s ease-in-out infinite alternate;
    z-index: 0;
    will-change: transform;
  }

  @keyframes slowZoom {
    from { transform: scale(1.1); }
    to   { transform: scale(1.25); }
  }

  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center,
      transparent 45%,
      rgba(0,0,0,0.55) 100%);
    pointer-events: none;
    z-index: 50;
  }

  #grainCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 100;
    opacity: 0.09;
    mix-blend-mode: overlay;
  }

  .flicker {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 101;
    background:
      repeating-linear-gradient(
        0deg,
        rgba(255,255,255,0.03) 0px,
        rgba(255,255,255,0.03) 1px,
        transparent 1px,
        transparent 2px
      );
    mix-blend-mode: overlay;
    opacity: 0.6;
    animation: flickerMove 0.15s steps(3) infinite,
               flickerBrightness 4s ease-in-out infinite;
  }

  @keyframes flickerMove {
    0%   { transform: translate(0, 0); }
    33%  { transform: translate(-1px, 1px); }
    66%  { transform: translate(1px, -1px); }
    100% { transform: translate(0, 0); }
  }

  @keyframes flickerBrightness {
    0%, 100% { opacity: 0.4; }
    47%      { opacity: 0.55; }
    48%      { opacity: 0.2; }
    49%      { opacity: 0.6; }
    50%      { opacity: 0.35; }
  }

  .trailer {
    position: relative;
    z-index: 10;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }

  .trailer-line {
    font-size: clamp(20px, 7vw, 56px);
    letter-spacing: 0.15em;
    line-height: 1.4;
    text-transform: uppercase;
    font-weight: 400;
    opacity: 0;
    transform: translateY(20px);
    animation: fadeInUp 1.5s forwards;
    text-shadow: 0 0 30px rgba(255,255,255,0.3);
    padding: 0 8px;
  }

  @keyframes fadeInUp {
    to { opacity: 1; transform: translateY(0); }
  }

  .final {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    padding-top: max(24px, env(safe-area-inset-top));
    padding-bottom: max(24px, env(safe-area-inset-bottom));
    text-align: center;
    z-index: 60;
    animation: fadeIn 1.5s forwards;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  .final.visible { display: flex; }

  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  .final .title {
    font-size: clamp(24px, 8vw, 64px);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 24px;
    text-shadow: 0 0 40px rgba(255,221,0,0.5);
    animation: titlePulse 3s ease-in-out infinite;
    line-height: 1.1;
  }

  @keyframes titlePulse {
    0%, 100% { text-shadow: 0 0 40px rgba(255,221,0,0.5); }
    50%      { text-shadow: 0 0 60px rgba(255,221,0,0.8),
                           0 0 80px rgba(255,221,0,0.4); }
  }

  .final .meta {
    font-size: clamp(12px, 3.5vw, 18px);
    letter-spacing: 0.1em;
    line-height: 1.9;
    margin-bottom: 24px;
    color: #ccc;
    padding: 0 8px;
  }

  .final .meta .highlight {
    color: #ffdd00;
    font-weight: bold;
  }

  .rating {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: 2px solid #fff;
    padding: 6px 14px;
    margin-bottom: 20px;
    letter-spacing: 0.15em;
    font-size: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .rating .age {
    background: #fff;
    color: #000;
    padding: 3px 10px;
    font-weight: bold;
  }

  .final-buttons {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
    max-width: 420px;
  }

  #trailerScreen button {
    background: transparent;
    border: 2px solid #fff;
    color: #fff;
    font-family: inherit;
    font-size: 13px;
    padding: 14px 24px;
    cursor: pointer;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
    min-height: 48px;
    flex: 1 1 auto;
    min-width: 140px;
  }

  #trailerScreen button::before {
    content: '';
    position: absolute;
    inset: 0;
    background: #fff;
    transform: translateX(-100%);
    transition: transform 0.3s;
    z-index: -1;
  }

  #trailerScreen button:active { color: #000; }
  #trailerScreen button:active::before { transform: translateX(0); }

  @media (hover: hover) and (pointer: fine) {
    #trailerScreen button:hover { color: #000; }
    #trailerScreen button:hover::before { transform: translateX(0); }
  }

  #trailerScreen button.yes {
    border-color: #ffdd00;
    color: #ffdd00;
  }
  #trailerScreen button.yes::before { background: #ffdd00; }
  #trailerScreen button.yes:active { color: #000; }
  #trailerScreen button.yes:disabled {
    opacity: 0.6;
    cursor: default;
  }

  .skip, .mute {
    position: fixed;
    bottom: max(20px, env(safe-area-inset-bottom));
    font-size: 12px;
    letter-spacing: 0.15em;
    color: rgba(255,255,255,0.6);
    cursor: pointer;
    z-index: 200;
    text-transform: uppercase;
    transition: color 0.3s;
    font-family: 'Georgia', serif;
    user-select: none;
    padding: 12px;
    -webkit-tap-highlight-color: transparent;
  }

  .skip { right: max(12px, env(safe-area-inset-right)); }
  .mute { left:  max(12px, env(safe-area-inset-left)); }

  .skip:active, .mute:active { color: #fff; }

  @media (max-width: 600px) {
    .terminal {
      padding: 16px;
      max-height: 85dvh;
      border-width: 1.5px;
    }
    .terminal::before {
      font-size: 10px;
      top: -10px;
      right: 12px;
    }
    .line { font-size: 12px; margin-bottom: 6px; }
    input[type="text"] { font-size: 16px; letter-spacing: 1px; }

    .start-btn {
      font-size: 12px;
      padding: 12px 24px;
      letter-spacing: 2px;
    }

    .trailer { padding: 16px; }
    .trailer-line { letter-spacing: 0.1em; }

    .final { padding: 20px 12px; }
    .final .meta { line-height: 1.7; }
    .final-buttons { gap: 10px; }

    #trailerScreen button {
      font-size: 12px;
      padding: 12px 18px;
      min-width: 0;
      width: 100%;
      flex: 1 1 100%;
    }

    .skip, .mute { font-size: 11px; padding: 10px 8px; }
  }

  @media (max-width: 360px) {
    .trailer-line { font-size: 18px; }
    .final .title { font-size: 22px; }
    .rating { font-size: 10px; padding: 5px 10px; }
    #trailerScreen button { font-size: 11px; }
  }

  @media (hover: none) and (pointer: coarse) {
    #noBtn {
      transition: transform 0.2s, opacity 0.2s;
    }
    #noBtn:active {
      transform: scale(0.85);
      opacity: 0.5;
    }
  }

  @media (max-height: 500px) and (orientation: landscape) {
    .final .title { font-size: 22px; margin-bottom: 12px; }
    .final .meta { font-size: 11px; line-height: 1.5; margin-bottom: 12px; }
    .rating { font-size: 10px; padding: 4px 10px; margin-bottom: 12px; }
    #trailerScreen button { padding: 10px 16px; font-size: 11px; min-height: 40px; }
    .trailer-line { font-size: 20px; }
  }
</style>
</head>
<body>

<div id="terminalScreen">
  <div class="terminal">
    <div id="output"></div>

    <button class="start-btn" id="startBtn">▶ ЗАПУСТИТЬ СИСТЕМУ</button>

    <div class="input-line" id="loginScreen" style="display:none;">
      <span class="prompt">></span>
      <input type="text" id="passwordInput" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="введите пароль...">
    </div>
  </div>
</div>

<div id="glitchOverlay"></div>

<div id="trailerScreen">
  <div class="bg"></div>
  <div class="vignette"></div>
  <canvas id="grainCanvas"></canvas>
  <div class="flicker"></div>

  <div class="trailer" id="trailer">
    <div id="trailerContent"></div>
  </div>

  <div class="skip" id="skip">Пропустить ▸</div>
  <div class="mute" id="mute">🔇 MUTE</div>

  <!-- Музыка: стартует только на финальном экране -->
  <audio id="bgMusic" loop>
    <source src="Start.mp3" type="audio/mpeg">
  </audio>

  <!-- Фоновый эмбиент терминала -->
  <audio id="terminalAmbient" loop>
    <source src="terminal-ambient.mp3" type="audio/mpeg">
  </audio>

  <div class="final" id="final">
    <div class="rating">
      РЕЙТИНГ <span class="age">16+</span> ЖАНР: КОМЕДИЯ, ВЕЧЕРИНКА
    </div>

    <div class="title">День рождения</div>

    <div class="meta">
      В ГЛАВНОЙ РОЛИ: <span class="highlight">[ИМЯ]</span><br>
      ДАТА ПРЕМЬЕРЫ: <span class="highlight">[ДД.ММ.ГГГГ]</span><br>
      МЕСТО: <span class="highlight">[АДРЕС]</span><br>
      ВРЕМЯ: <span class="highlight">[ЧЧ:ММ]</span>
    </div>

    <div class="final-buttons">
      <button class="yes" id="yesBtn">Купить билет</button>
      <button id="noBtn">Не приду</button>
    </div>
  </div>
</div>

<script>
  /* ============================================
     НАСТРОЙКИ
     ============================================ */
  const PASSWORD = 'днюха';

  const BOOT_LINES = [
    '> INITIALIZING SYSTEM...',
    '> CONNECTING TO SECURE SERVER...',
    '> SCANNING ACCESS CREDENTIALS...',
    '',
    '> ДОСТУП К СЕКРЕТНЫМ ФАЙЛАМ ЗАПРЕЩЁН.',
    '> ТРЕБУЕТСЯ АВТОРИЗАЦИЯ.',
    ''
  ];

  // Строки трейлера: текст, озвучка, задержка
  // vibration — паттерн вибрации на мобилке (в миллисекундах)
  const LINES = [
    { text: 'В этом году...',  voice: 'voiceover-1.mp3', delay: 1800, vibration: 30 },
    { text: 'Одна ночь...',    voice: 'voiceover-2.mp3', delay: 1800, vibration: 30 },
    { text: 'Изменит всё...',  voice: 'voiceover-3.mp3', delay: 2200, vibration: 50 },
    { text: '',                voice: null,              delay: 600,  vibration: 0  },
    { text: 'Скоро...',        voice: 'voiceover-4.mp3', delay: 2800, vibration: [80, 40, 80] }
  ];

  /* ============================================
     ЭЛЕМЕНТЫ
     ============================================ */
  const output = document.getElementById('output');
  const startBtn = document.getElementById('startBtn');
  const loginScreen = document.getElementById('loginScreen');
  const passwordInput = document.getElementById('passwordInput');
  const terminalScreen = document.getElementById('terminalScreen');
  const glitchOverlay = document.getElementById('glitchOverlay');
  const terminalAmbient = document.getElementById('terminalAmbient');

  let wrongAttempts = 0;
  let terminalStarted = false;

  /* ============================================
     ВИБРАЦИЯ (только на мобилке)
     ============================================ */
  const canVibrate = ('vibrate' in navigator);

  function vibrate(pattern) {
    if (!canVibrate) return;
    // Паттерн может быть числом или массивом
    if (pattern && pattern !== 0) {
      try { navigator.vibrate(pattern); } catch (e) {}
    }
  }

  /* ============================================
     ПЛАВНОЕ ЗАТУХАНИЕ ЗВУКА
     ============================================ */
  function fadeOutAudio(audioEl, duration = 400, onComplete) {
    if (!audioEl || audioEl.paused) {
      if (onComplete) onComplete();
      return;
    }

    const startVol = audioEl.volume;
    const steps = 20;
    const stepTime = duration / steps;
    let step = 0;

    const fade = setInterval(() => {
      step++;
      audioEl.volume = Math.max(0, startVol * (1 - step / steps));
      if (step >= steps) {
        clearInterval(fade);
        audioEl.pause();
        audioEl.volume = startVol; // возвращаем на случай повторного запуска
        if (onComplete) onComplete();
      }
    }, stepTime);
  }

  /* ============================================
     ПРЕДЗАГРУЗКА ОЗВУЧЕК
     ============================================ */
  function preloadVoices() {
    LINES.forEach(item => {
      if (item.voice) {
        const a = new Audio();
        a.preload = 'auto';
        a.src = item.voice;
      }
    });
  }
  preloadVoices();

  /* ============================================
     КНОПКА ЗАПУСКА ТЕРМИНАЛА
     ============================================ */
  startBtn.addEventListener('click', () => {
    if (terminalStarted) return;
    terminalStarted = true;

    // Короткая вибрация на нажатие
    vibrate(20);

    startBtn.style.display = 'none';

    // Запускаем фоновый эмбиент терминала (loop)
    terminalAmbient.volume = 0.25;
    terminalAmbient.play().catch(() => {});

    typeLines(BOOT_LINES, () => {
      loginScreen.style.display = 'flex';
      if (window.matchMedia('(hover: hover)').matches) {
        passwordInput.focus();
      }
    });
  });

  /* ============================================
     ПЕЧАТЬ (без звука печати, эмбиент играет сам)
     ============================================ */
  function typeLines(lines, callback) {
    let i = 0;
    function nextLine() {
      if (i >= lines.length) {
        if (callback) callback();
        return;
      }
      const line = document.createElement('div');
      line.className = 'line cursor';
      output.appendChild(line);

      let j = 0;
      const text = lines[i];

      const interval = setInterval(() => {
        line.textContent = text.slice(0, j + 1);
        j++;
        if (j >= text.length) {
          clearInterval(interval);
          line.classList.remove('cursor');
          i++;
          setTimeout(nextLine, 180);
        }
      }, 22);
    }
    nextLine();
  }

  /* ============================================
     ПРОВЕРКА ПАРОЛЯ
     ============================================ */
  passwordInput.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;

    const value = passwordInput.value.trim().toLowerCase();
    passwordInput.value = '';

    if (value === PASSWORD.toLowerCase()) {
      // Короткая вибрация на успех
      vibrate(40);

      // Плавно гасим эмбиент терминала перед переходом
      fadeOutAudio(terminalAmbient, 400, () => {
        terminalAmbient.pause();
      });
      triggerTransition();
    } else {
      // Двойная вибрация на ошибку
      vibrate([40, 60, 40]);

      wrongAttempts++;
      const err = document.createElement('div');
      err.className = 'line error';

      if (wrongAttempts === 1) {
        err.textContent = '> НЕВЕРНЫЙ ПАРОЛЬ. ПОПРОБУЙ ЕЩЁ РАЗ.';
      } else if (wrongAttempts === 2) {
        err.textContent = '> ОПЯТЬ НЕВЕРНО. ТЫ УВЕРЕН, ЧТО ТЕБЯ ЗВАЛИ?';
      } else if (wrongAttempts === 3) {
        err.textContent = '> ДА ТЫ ЗАЕБАЛ. ПОДСКАЗКА: ЭТО СВЯЗАНО С ПОВОДОМ.';
      } else {
        err.textContent = `> ВСЁ, Я УСТАЛ. ПАРОЛЬ: "${PASSWORD}". ВВОДИ.`;
      }

      output.appendChild(err);
      err.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  });

  /* ============================================
     ПЕРЕХОД ТЕРМИНАЛ → ТРЕЙЛЕР
     ============================================ */
  function triggerTransition() {
    const ok = document.createElement('div');
    ok.className = 'line';
    ok.style.color = '#33ff33';
    ok.textContent = '> ДОСТУП РАЗРЕШЁН. ЗАГРУЗКА ФАЙЛА...';
    output.appendChild(ok);

    loginScreen.style.display = 'none';

    setTimeout(() => {
      glitchOverlay.classList.add('active');
      terminalScreen.classList.add('fade-out');

      setTimeout(() => {
        terminalScreen.style.display = 'none';
        glitchOverlay.classList.remove('active');
        document.getElementById('trailerScreen').classList.add('visible');

        startTrailer();
        startGrain();
      }, 900);
    }, 1200);
  }

  /* ============================================
     ЗЕРНО
     ============================================ */
  const grainCanvas = document.getElementById('grainCanvas');
  const gctx = grainCanvas.getContext('2d', { alpha: true });
  let grainRunning = false;
  let grainFrame = 0;

  function resizeGrain() {
    const scale = window.innerWidth < 700 ? 2 : 1;
    grainCanvas.width = Math.floor(window.innerWidth / scale);
    grainCanvas.height = Math.floor(window.innerHeight / scale);
    grainCanvas.style.imageRendering = 'pixelated';
  }
  resizeGrain();
  window.addEventListener('resize', resizeGrain);
  window.addEventListener('orientationchange', () => setTimeout(resizeGrain, 200));

  function drawGrain() {
    if (!grainRunning) return;
    grainFrame++;
    if (grainFrame % 2 === 0) {
      const w = grainCanvas.width;
      const h = grainCanvas.height;
      const imageData = gctx.createImageData(w, h);
      const data = imageData.data;
      for (let i = 0; i < data.length; i += 4) {
        const v = Math.random() * 255;
        data[i] = v; data[i + 1] = v; data[i + 2] = v; data[i + 3] = 255;
      }
      gctx.putImageData(imageData, 0, 0);
    }
    requestAnimationFrame(drawGrain);
  }
  function startGrain() { if (grainRunning) return; grainRunning = true; drawGrain(); }

  /* ============================================
     ТРЕЙЛЕР
     ============================================ */
  const trailerContent = document.getElementById('trailerContent');
  const trailer = document.getElementById('trailer');
  const final = document.getElementById('final');
  const skip = document.getElementById('skip');
  const yesBtn = document.getElementById('yesBtn');
  const noBtn = document.getElementById('noBtn');
  const mute = document.getElementById('mute');
  const music = document.getElementById('bgMusic');

  let currentLine = 0;
  let skipped = false;
  const voicePlayer = new Audio();

  function startTrailer() {
    currentLine = 0;
    skipped = false;
    setTimeout(showNextLine, 800);
  }

  function showNextLine() {
    if (skipped) return;

    if (currentLine >= LINES.length) {
      showFinal();
      return;
    }

    const item = LINES[currentLine];

    // 1. Вибрация на появление строки
    if (item.vibration) {
      vibrate(item.vibration);
    }

    // 2. Показываем визуальную строку
    const line = document.createElement('div');
    line.className = 'trailer-line';
    line.textContent = item.text;
    trailerContent.innerHTML = '';
    trailerContent.appendChild(line);

    // 3. Параллельно запускаем озвучку
    if (item.voice) {
      voicePlayer.pause();
      voicePlayer.src = item.voice;
      voicePlayer.volume = 0.9;
      voicePlayer.currentTime = 0;

      const playPromise = voicePlayer.play();
      if (playPromise) playPromise.catch(() => {
        // Если браузер блокирует — пробуем ещё раз через 100 мс
        setTimeout(() => voicePlayer.play().catch(() => {}), 100);
      });
    }

    currentLine++;
    setTimeout(showNextLine, item.delay);
  }

  function showFinal() {
    // Вибрация на финал — двойной удар
    vibrate([60, 50, 100]);

    // Плавно гасим озвучку за 400 мс
    fadeOutAudio(voicePlayer, 400);

    trailer.style.display = 'none';
    skip.style.display = 'none';
    final.classList.add('visible');

    // === МУЗЫКА СТАРТУЕТ ЗДЕСЬ — ровно в момент появления «Билета» ===
    // Небольшая задержка, чтобы голос успел затихнуть
    setTimeout(() => {
      music.volume = 0;
      music.currentTime = 0;
      music.play().catch(() => {});

      // Плавный fade-in громкости до 0.4
      let vol = 0;
      const fadeIn = setInterval(() => {
        vol += 0.02;
        music.volume = Math.min(vol, 0.4);
        if (vol >= 0.4) clearInterval(fadeIn);
      }, 50);
    }, 400);
  }

  skip.addEventListener('click', () => {
    skipped = true;
    vibrate(30);
    // showFinal сам сделает fade-out озвучки
    showFinal();
  });

  /* ============================================
     MUTE
     ============================================ */
  let muted = false;
  mute.addEventListener('click', () => {
    muted = !muted;
    music.muted = muted;
    voicePlayer.muted = muted;
    terminalAmbient.muted = muted;
    mute.textContent = muted ? '🔊 UNMUTE' : '🔇 MUTE';

    if (!muted && music.paused && final.classList.contains('visible')) {
      music.play().catch(() => {});
    }
  });

  /* ============================================
     КНОПКИ ФИНАЛА
     ============================================ */
  yesBtn.addEventListener('click', () => {
    vibrate([30, 30, 30]);
    yesBtn.textContent = '✓ Билет забронирован';
    yesBtn.disabled = true;
    yesBtn.style.opacity = '0.7';
    // window.open('https://t.me/username', '_blank');
  });

  if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
    noBtn.addEventListener('mouseover', () => {
      const x = Math.random() * 200 - 100;
      const y = Math.random() * 100 - 50;
      noBtn.style.transform = `translate(${x}px, ${y}px)`;
    });
  }
</script>

</body>
